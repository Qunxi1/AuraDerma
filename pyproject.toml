[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auraderma"
version = "0.1.0"
description = "Skincare agent CLI MVP with RAG, memory, and web fallback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "qdrant-client>=1.11.3",
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "pymupdf>=1.24.9",
  "python-docx>=1.1.2",
  "requests>=2.32.3",
  "sentence-transformers>=3.0",
  "beautifulsoup4>=4.12",
]

[project.scripts]
auraderma = "auraderma:main"
ad = "ad_entry:ad_main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["auraderma", "ad_entry", "cli", "agent", "config", "ingest", "llm", "memory", "prompts", "reporter", "retrieval", "schema", "skill_manager", "skills_registry"]

[tool.ruff]
line-length = 100
