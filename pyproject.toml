[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auraderma"
version = "0.1.0"
description = "Skincare agent CLI MVP with RAG, memory, and web fallback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "qdrant-client>=1.11.3",
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "pymupdf>=1.24.9",
  "python-docx>=1.1.2",
  "requests>=2.32.3",
  "sentence-transformers>=3.0",
  "beautifulsoup4>=4.12",
]

[project.scripts]
auraderma = "auraderma:main"
ad = "ad_entry:ad_main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["auraderma", "ad_entry", "cli", "agent", "config", "ingest", "llm", "memory", "prompts", "reporter", "retrieval", "schema", "skill_manager", "skills_registry"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误（含 E501 行宽）
    "W",    # pycodestyle 警告（尾随空格等）
    "F",    # pyflakes（未使用导入、未定义名称）
    "I",    # isort 导入排序
    "UP",   # pyupgrade 现代语法
    "B",    # flake8-bugbear 常见陷阱
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "BLE",  # flake8-blind-except 盲捕获
    "DTZ",  # flake8-datetimez 时区安全
    "RUF",  # ruff 专属规则
]
ignore = [
    # 中文项目必关：全角标点（，。：（））会被判为“歧义 Unicode 字符”
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 入口脚本需在 import 之间调整 sys.path，E402 属有意为之
"run_ingest_products.py" = ["E402"]
"src/cli.py" = ["E402"]
# Prompt 模板是整段中文/英文长文本，拆行会破坏可读性与语义
"src/prompts.py" = ["E501"]
"src/prompts_react.py" = ["E501"]
